pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'topo_mod'

include 'allay-variants', 'damage-numbers', 'bundle'

// Topo is its own mod, left out of the build (and out of the bundle) unless asked for: set include_topo=true in
// gradle.properties, or pass -Pinclude_topo=true.
if (providers.gradleProperty('include_topo').getOrElse('false') == 'true') {
	include 'topo'
}
