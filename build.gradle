plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

// Shared setup for every module (companion, damage-numbers, bundle).
// Each module sets its own `mod_id` in its gradle.properties.
subprojects {
	apply plugin: 'net.fabricmc.fabric-loom'

	base.archivesName = project.mod_id

	loom {
		splitEnvironmentSourceSets()

		mods {
			"${project.mod_id}" {
				sourceSet sourceSets.main
				sourceSet sourceSets.client
			}
		}
	}

	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
		implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
	}

	processResources {
		def version = project.version
		inputs.property "version", version

		filesMatching("fabric.mod.json") {
			expand "version": version
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
	}

	java {
		withSourcesJar()

		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}

	jar {
		def projectName = project.name
		inputs.property "projectName", projectName

		from(rootProject.file("LICENSE")) {
			rename { "${it}_$projectName"}
		}
	}
}
